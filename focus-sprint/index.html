<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Sprint</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Focus Sprint</h1>
      <button id="themeToggle" class="icon-btn" title="Cambia tema" aria-label="Cambia tema">🌙</button>
    </header>

    <nav class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="work">Lavoro</button>
      <button class="mode-tab" data-mode="short">Pausa breve</button>
      <button class="mode-tab" data-mode="long">Pausa lunga</button>
    </nav>

    <main class="timer-card">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 220 220">
          <circle class="ring-track" cx="110" cy="110" r="100"></circle>
          <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"></circle>
        </svg>
        <div class="ring-center">
          <span id="timeDisplay" class="time">25:00</span>
          <span id="cycleLabel" class="cycle-label">Ciclo 1 di 4</span>
        </div>
      </div>

      <div class="controls">
        <button id="resetBtn" class="icon-btn" title="Reset" aria-label="Reset">↺</button>
        <button id="startPauseBtn" class="primary-btn">Avvia</button>
        <button id="soundBtn" class="icon-btn" title="Suono ambientale" aria-label="Suono ambientale">🔈</button>
      </div>
    </main>

    <section class="stats-card">
      <div class="stats-row">
        <div class="stat">
          <span class="stat-value" id="statToday">0</span>
          <span class="stat-label">Sessioni oggi</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statMinutes">0</span>
          <span class="stat-label">Minuti focus oggi</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statStreak">0</span>
          <span class="stat-label">Giorni di fila</span>
        </div>
      </div>
      <div class="chart" id="weekChart" aria-label="Sessioni completate negli ultimi 7 giorni"></div>
    </section>

    <button id="settingsToggle" class="link-btn">Impostazioni durate</button>
    <section class="settings-card" id="settingsCard" hidden>
      <label>
        Lavoro (min)
        <input type="number" id="workInput" min="1" max="120" value="25" />
      </label>
      <label>
        Pausa breve (min)
        <input type="number" id="shortInput" min="1" max="60" value="5" />
      </label>
      <label>
        Pausa lunga (min)
        <input type="number" id="longInput" min="1" max="90" value="15" />
      </label>
      <button id="saveSettingsBtn" class="primary-btn small">Salva</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
